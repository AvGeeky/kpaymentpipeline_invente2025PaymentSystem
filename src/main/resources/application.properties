spring.application.name=kpaymentpipeline
spring.devtools.restart.enabled=true
server.address=0.0.0.0
server.error.include-stacktrace=never
server.error.include-message=never
server.port=8080


spring.kafka.bootstrap-servers=localhost:9092
# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.group-id=payment-verif-group
spring.kafka.consumer.auto-offset-reset=earliest

kafka.topic.payment-received=payment-received
kafka.topic.email-receipt=email-receipt
kafka.topic.payment-reconciled=payment-reconciled




spring.kafka.admin.auto-create=true
spring.kafka.admin.fail-fast=true

# --- PostgreSQL Database ---
# The sessionTimezone parameter is required to fix the connection issue.
#spring.datasource.url=jdbc:postgresql://localhost:5432/paymentdb?sessionTimezone=Asia/Kolkata
#spring.datasource.username=postgres
#spring.datasource.password=postgres
#spring.datasource.driver-class-name=org.postgresql.Driver


# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.saipbuilds.kpaymentpipeline.entity

spring.data.redis.timeout=5000ms
spring.data.redis.client-name=attendez
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
# Use lettuce explicitly if switching from Jedis
spring.data.redis.client-type=lettuce

