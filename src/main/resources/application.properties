spring.application.name=kpaymentpipeline
spring.devtools.restart.enabled=true
server.address=0.0.0.0
server.error.include-stacktrace=never
server.error.include-message=never
server.port=8080


spring.kafka.bootstrap-servers=localhost:9092


# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.group-id=payment-verif-group
spring.kafka.consumer.auto-offset-reset=earliest

kafka.topic.payment-received=payment-received
kafka.topic.email-receipt=email-receipt
kafka.topic.payment-reconciled=payment-reconciled



spring.kafka.admin.auto-create=true
spring.kafka.admin.fail-fast=true

spring.datasource.url=jdbc:postgresql://localhost:5432/paymentdb?serverTimezone=Asia/Kolkata
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.saipbuilds.kpaymentpipeline.entity

