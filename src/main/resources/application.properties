spring.application.name=kpaymentpipeline
spring.devtools.restart.enabled=true
server.address=0.0.0.0
server.error.include-stacktrace=never
server.error.include-message=never
server.port=${APP_PORT:8080}

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.streams.replication-factor=1
spring.kafka.streams.application-id=${KAFKA_APP_ID:default-reconciliation}
spring.kafka.streams.state-dir=${KAFKA_STATE_DIR:kstream-state}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:payment-verif-group}
spring.kafka.consumer.auto-offset-reset=earliest

kafka.topic.payment-received=${TOPIC_PAYMENT_RECEIVED:payment-received}
kafka.topic.hackathon-payment_received=${TOPIC_HACKATHON_PAYMENT_RECEIVED:hackathon-payment}
kafka.topic.email-receipt=${TOPIC_EMAIL_RECEIPT:email-receipt}
kafka.topic.payment-reconciled=${TOPIC_PAYMENT_RECONCILED:payment-reconciled}
kafka.topic.hackathon-payment_reconciled=${TOPIC_HACKATHON_PAYMENT_RECONCILED:hackathon-reconciled}

spring.kafka.admin.auto-create=true
spring.kafka.admin.fail-fast=true

# --- PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/paymentdb?currentSchema=public&stringtype=unspecified&options=-c%20TimeZone=Asia/Kolkata}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- MyBatis ---
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.saipbuilds.kpaymentpipeline.entity

# --- Redis ---
spring.data.redis.timeout=${REDIS_TIMEOUT:5000ms}
spring.data.redis.client-name=${REDIS_CLIENT_NAME:attendez}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.client-type=lettuce
